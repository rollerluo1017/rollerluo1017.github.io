<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>转砖数回</title>
<style>
:root{
  --bg:#f6f3ec;--card:#fffdf8;--ink:#2a2a33;--sub:#77736a;--dot:#3a3a44;
  --o:#f08a24;--ok:#2f9e44;--btn:#ece7dc;
  --face:#f6eedd;--edge:#d8c9aa;--num:#9a8b6e;--spin:#8f8470;
  --lock:#8d6b4b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  display:flex;flex-direction:column;align-items:center;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
.wrap{width:100%;max-width:560px;padding:10px 16px 20px;display:flex;flex-direction:column;gap:10px;min-height:100%}
header{display:flex;align-items:center;gap:8px}
header h1{font-size:16px;white-space:nowrap;margin:0;flex:1;letter-spacing:1px}
.lvnav{display:flex;gap:6px;align-items:center}
.lvbtn{height:34px;padding:0 12px;border-radius:10px;border:0;background:var(--ink);color:#fff;font-size:15px;font-weight:700}
button.icon{width:34px;height:34px;border-radius:10px;border:0;background:var(--btn);font-size:17px;font-weight:700;color:var(--ink)}
button:disabled{opacity:.35}
b.o{color:var(--o)} b.b{color:var(--lock)}
.tip{background:var(--card);border-radius:12px;padding:9px 12px;box-shadow:0 1px 3px #0001;min-height:44px}
.tip .rule{font-size:15px;font-weight:700;letter-spacing:1px}
.tip .sub{font-size:13px;line-height:1.6;color:var(--sub);margin-top:2px}
.tip .sub:empty{display:none}
.tip .t{display:inline-block;background:var(--ink);color:#fff;border-radius:6px;padding:0 6px;margin-right:6px;font-size:12px;font-weight:700}
.boardbox{background:var(--card);border-radius:16px;box-shadow:0 1px 3px #0001;padding:6px;position:relative}
svg{display:block;width:100%;height:auto;touch-action:none}
/* 砖：能转的砖浅木色、带厚度，像按钮；固定砖深木色（胡桃木）、扁平 */
.tile .edge{fill:var(--edge)}
.tile .face{fill:var(--face);transition:fill .2s,transform .08s}
.tile.press .face,.tile.press .num{transform:translateY(2px)}
.tile.locked .face{fill:var(--lock)}
.tile.locked .num{fill:#fff6e6}
.tile.hint .face{fill:#ffe08a}
/* 换位关：选中的砖描橙边，拖到的目标砖变深一点 */
.tile.sel .face{fill:#ffe9a8;stroke:var(--ink);stroke-width:3}
/* 换位关要看清每块砖的形状：对上的边也在砖上留一道浅色短杠 */
svg.swap .tile:not(.locked) .bar{opacity:1;stroke:#d3c4a2}
svg.swap .tile .bar.miss{stroke:var(--o)}
svg.swap.won .tile .bar{opacity:0}
.tile.tgt .face{fill:#eadbb6}
.tile .rot{transition:transform .18s ease-out}
/* 砖身上的短杠：对上了就藏起来（格线上画黑线），没对上才露出橙色；转动的时候整块砖的边都露出来 */
.tile .bar{stroke:var(--o);stroke-width:7;stroke-linecap:round;opacity:0;transition:opacity .12s}
.tile .bar.miss{opacity:1}
.tile.spin .bar{opacity:1;stroke:var(--spin)}
.tile.locked.spin .bar{stroke:#fff}
.num{font-size:22px;font-weight:700;fill:var(--num);text-anchor:middle;dominant-baseline:central;pointer-events:none;transition:transform .08s}
.blank{fill:none;stroke:#d0c6b2;stroke-width:1.5;stroke-dasharray:4 4}
.line{stroke:var(--ink);stroke-width:8;stroke-linecap:round;pointer-events:none;transition:opacity .1s,stroke .25s}
.line.lit{stroke:var(--ok)}
/* 通关时绕圈跑的光点 */
.glow{fill:#ffd43b;opacity:.5;pointer-events:none}
.core{fill:#fff;stroke:#ffd43b;stroke-width:2;pointer-events:none}
.line.fade{opacity:0}
svg.won .line{stroke:var(--ok)}
svg.won .tile .face{fill:#e3f1e0}
svg.won .tile.locked .face{fill:#5f9e74}
.vbad{fill:none;stroke:var(--o);stroke-width:3.5;animation:flash .5s ease-in-out infinite alternate;pointer-events:none}
@keyframes flash{from{opacity:.25}to{opacity:1}}
.finger{font-size:26px;pointer-events:none;animation:poke 1s ease-in-out infinite}
@keyframes poke{0%,100%{transform:translate(0,4px)}50%{transform:translate(0,-6px)}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.row{display:flex;gap:8px}
.row button{flex:1;height:44px;border:0;border-radius:12px;background:var(--btn);color:var(--ink);font-size:15px;font-weight:700}
.stats{display:flex;justify-content:space-between;color:var(--sub);font-size:12px;padding:0 4px}
.status{font-size:14px;font-weight:600;text-align:center;min-height:20px;color:var(--sub)}
.status.ok{color:var(--ok)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#2a2a33ee;color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;width:max-content;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%)}
.modal{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal.show{display:flex}
/* 通关卡贴在下面，不挡住盘面 */
#win{align-items:flex-end;background:#0002}
#win .box{box-shadow:0 -4px 24px #0002}
.modal .box{background:var(--card);border-radius:18px;padding:20px;max-width:420px;width:100%;line-height:1.6;font-size:15px;max-height:90vh;overflow:auto}
.modal h2{margin:0 0 10px;font-size:20px}
.modal button{width:100%;height:46px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:var(--ink);color:#fff;margin-top:6px}
.modal button.sec{background:var(--btn);color:var(--ink)}
.ill{display:flex;align-items:center;gap:12px;margin:0 0 10px}
.ill svg{flex:none}
.ill .slot{width:96px;flex:none;display:flex;justify-content:center}
.ill div{flex:1;font-size:14px}
.picks{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:4px 0 6px}
.chh{font-size:13px;font-weight:700;color:var(--sub);margin:10px 0 2px}
.center{display:flex;justify-content:center;margin:6px 0 10px}
.picks button{height:46px;margin:0;background:var(--btn);color:var(--ink);font-size:15px;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.picks button i{font-style:normal;font-size:10px;letter-spacing:-1px;color:#e0a800;height:12px}
.picks button.cur{background:var(--ink);color:#fff}
.picks button.cur i{color:#ffd45c}
.picks button.done::after{content:"✓";font-size:11px;color:var(--ok)}
.picks button.sw::before{content:"换";position:absolute;top:2px;right:5px;font-size:10px;font-weight:700;color:var(--o)}
.chh span{float:right;color:#d99a00}
.modal h2 small{font-size:14px;color:#d99a00;margin-left:6px}
/* 通关卡的星星：一颗一颗弹出来 */
.stars{display:flex;justify-content:center;gap:8px;margin:0 0 4px;min-height:0}
.stars span{display:inline-block;font-size:40px;line-height:1.1;color:#e4dccb}
.stars span.on{color:#f5b301;animation:pop .45s both}
@keyframes pop{0%{transform:scale(.2);opacity:0}65%{transform:scale(1.3);opacity:1}100%{transform:scale(1)}}
.winsub{text-align:center;color:var(--sub);font-size:13px;margin:-8px 0 10px}
.winsub:empty{display:none}
/* 第六版：通关后盘面变成马赛克，再淡入成画的一块；每 25 关拼一幅大画 */
svg .dot{transition:opacity .4s}
svg.mosaic .tile,svg.mosaic .line,svg.mosaic .dot,svg.mosaic .blank{opacity:0;transition:opacity .45s}
.mos rect{opacity:0;transform-box:fill-box;transform-origin:center;animation:mosIn .42s ease-out both}
@keyframes mosIn{0%{opacity:0;transform:scale(.3)}70%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
.pimg{opacity:0;transition:opacity 1.1s ease-in-out}
.pimg.show{opacity:1}
.paint{position:relative;background-size:100% 100%;aspect-ratio:1120/1280;border-radius:6px;overflow:hidden;box-shadow:0 1px 4px #0003;flex:none}
.paint i{position:absolute;background:#2e3b45;box-shadow:inset 0 0 0 .5px #ffffff22;display:flex;align-items:center;justify-content:center;
  font-style:normal;font-size:10px;color:#ffffff55;font-weight:700}
.paint i.got{background:transparent;box-shadow:none}
.paint i.new{background:transparent;animation:newPiece 1.6s ease-out .2s both}
@keyframes newPiece{0%{background:#2e3b45;box-shadow:inset 0 0 0 3px #ffd43b}50%{background:#2e3b4500;box-shadow:inset 0 0 0 3px #ffd43b}100%{background:#2e3b4500;box-shadow:inset 0 0 0 0 #ffd43b00}}
.winrow{display:flex;gap:14px;align-items:center;margin:0 0 6px}
.winrow .paint{width:104px}
.winrow .wr{flex:1;min-width:0}
.winrow .stars{justify-content:flex-start}
.winrow .stars span{font-size:32px}
.winrow #winText{text-align:left!important;margin:2px 0 0!important;font-size:14px}
.ptitle{font-size:13px;color:var(--sub);font-weight:700;margin-top:4px}
.gal{display:flex;flex-direction:column;gap:16px;margin:4px 0 8px}
.gal .paint{width:100%;max-width:300px;margin:0 auto}
.gal .gh{display:flex;justify-content:space-between;font-weight:700;font-size:15px;margin-bottom:6px}
.gal .gh span{color:var(--sub);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>转砖数回</h1>
    <div class="lvnav"><button class="icon" id="prevBtn">‹</button><button class="lvbtn" id="lvBtn">第1关</button><button class="icon" id="nextBtn2">›</button></div>
    <button class="icon" id="galBtn" title="画册">🖼</button>
    <button class="icon" id="helpBtn">?</button>
  </header>
  <div class="tip"><div class="rule" id="rule">点砖转向 · 把边对上 · 连成一个圈</div><div class="sub" id="tip"></div></div>
  <div class="boardbox" id="boardbox"><svg id="svg"></svg></div>
  <div class="status" id="status"></div>
  <div class="row">
    <button id="undoBtn">↶ 撤销</button>
    <button id="hintBtn">💡 提示</button>
    <button id="resetBtn">⟲ 重来</button>
  </div>
  <div class="stats"><span id="stTime">用时 0:00</span><span id="stMove">转了 0 下</span><span id="stHint">提示 0 次</span></div>
</div>
<div class="toast" id="toast"></div>
<div class="modal" id="rules"><div class="box">
  <h2>怎么玩</h2>
  <div id="rulesBody"></div>
  <button id="rulesClose">知道了</button>
  <button class="sec" id="rulesTut">重玩教学关</button>
</div></div>
<div class="modal" id="blankCard"><div class="box">
  <h2>空格</h2>
  <div id="blankBody"></div>
  <button id="blankClose">知道了</button>
</div></div>
<div class="modal" id="chCard"><div class="box">
  <div style="color:var(--sub);font-size:13px;font-weight:700" id="chNo"></div>
  <h2 id="chTitle"></h2>
  <div id="chBody"></div>
  <button id="chClose">开始</button>
</div></div>
<div class="modal" id="swapCard"><div class="box">
  <div style="color:var(--sub);font-size:13px;font-weight:700">新玩法</div>
  <h2>换位关</h2>
  <div id="swapBody"></div>
  <button id="swapClose">开始</button>
</div></div>
<div class="modal" id="resetM"><div class="box">
  <h2>重来这一关？</h2>
  <p style="margin:0 0 10px">砖会回到开局的样子，步数和用时从头算。</p>
  <button id="resetYes">重来</button>
  <button class="sec" id="resetNo">取消</button>
</div></div>
<div class="modal" id="galM"><div class="box"><h2>画册</h2><p style="margin:0 0 8px;font-size:13px;color:var(--sub)">每过一关，盘面会变成画上的一块。25 关拼成一幅。</p><div class="gal" id="galList"></div><button class="sec" id="galClose">关闭</button></div></div>
<div class="modal" id="pick"><div class="box"><h2 id="pickTitle">选关</h2><div id="pickList"></div><button class="sec" id="pickClose">关闭</button></div></div>
<div class="modal" id="win"><div class="box">
  <h2 style="text-align:center" id="winTitle">完成！</h2>
  <div class="winrow" id="winRow"><div class="paint" id="winPaint"></div><div class="wr">
    <div class="stars" id="winStars"></div>
    <p id="winText" style="text-align:center;margin:4px 0 12px"></p>
    <div class="ptitle" id="winPic"></div></div></div>
  <p class="winsub" id="winSub"></p>
  <button id="nextBtn">下一关</button>
  <button class="sec" id="stayBtn">再看看</button>
</div></div>

// 第六版：两幅大画（build.js 塞进来），每幅 5×5 块，一块 224×256。第 1–25 关拼第一幅，第 26–50 关拼第二幅
// 两幅画不存图片，开局时用 art.html 的代码现画（木头拼花），画好后转成图片地址给缩略图和揭晓用；文件因此只有一百多 KB
const PICS=[{name:'日出',src:''},{name:'热气球',src:''}];const PW=1120,PH=1280,PX=224,PY=256;
const PIMG=[];
function drawArt(){const __cv=[0,1].map(()=>{const c=document.createElement("canvas");c.width=1120;c.height=1280;return c;});

// 两幅大画（每幅 5×5 块，一块 224×256），木头拼花（marquetry）风格：和游戏的木砖同一种材质
// 每一片木皮：底色 + 顺着纹理方向的细木纹 + 片与片之间一道深色拼缝。全部用代码画，种子固定可复现
function rng(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
const PW=1120,PH=1280;
// 木种（和游戏配色呼应：浅木砖 #f6eedd、胡桃木 #8d6b4b、橙 #f08a24）
const WOOD={
  birch:'#f1dfb8',maple:'#e6c993',oak:'#cfa165',cherry:'#b8683f',padauk:'#c4562c',
  walnut:'#7a5638',wenge:'#4a362a',ebony:'#2c231d',teal:'#5e8582',tealD:'#46676a',olive:'#8e8a55',
};
const shade=(hex,k)=>{if(hex[0]!=='#')return hex;const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=v=>Math.max(0,Math.min(255,Math.round(k>0?v+(255-v)*k:v*(1+k))));return`rgb(${f(r)},${f(g)},${f(b)})`;};
const hexOf=w=>WOOD[w]||w;
const GRAIN={};
function grainOf(x,col,gap){const key=col+gap;if(GRAIN[key])return GRAIN[key];
  const n=640,cv=document.createElement('canvas');cv.width=cv.height=n;const g=cv.getContext('2d'),R=rng(key.length*97+parseInt((col.match(/[0-9a-f]{6}/i)||['777777'])[0],16));
  g.fillStyle=col;g.fillRect(0,0,n,n);
  // 细线：略带波动，深浅交替；波动的周期取 n 的约数，左右接得上
  for(let v=0;v<n;v+=gap*(0.6+R()*0.8)){const dark=R()<.6;g.strokeStyle=shade(col,dark?-(0.06+R()*0.1):0.05+R()*0.08);
    g.globalAlpha=.35+R()*.45;g.lineWidth=.6+R()*1.6;const ph=R()*6,amp=1+R()*3,f1=Math.PI*2/n*(1+Math.floor(R()*3)),f2=f1*3;
    for(const dy of[-n,0,n]){g.beginPath();for(let u=0;u<=n;u+=16){const y=v+dy+Math.sin(u*f1+ph)*amp+Math.sin(u*f2+ph*2)*amp*.4;u?g.lineTo(u,y):g.moveTo(u,y);}g.stroke();}}
  return GRAIN[key]=x.createPattern(cv,'repeat');}
// 一片木皮：path 是一个画路径的函数；ang 是木纹方向（弧度）
function veneer(x,path,wood,ang,seed,opt){opt=opt||{};const R=rng(seed),col=hexOf(wood);
  x.save();x.beginPath();path(x);x.clip();
  x.fillStyle=col;x.fillRect(0,0,PW,PH);
  // 木纹：旋转坐标系后画一排略带波动的细线，深浅交替
  // 每种木头的纹理只画一次（一张 640×640 的横纹贴图），每片木皮按自己的方向和偏移去铺，这样页面里现画也快
  x.translate(PW/2,PH/2);x.rotate(ang);
  const D=1000,gap=opt.gap||5,pat=grainOf(x,col,gap);
  x.translate(-R()*640,-R()*640);x.fillStyle=pat;x.fillRect(-D*1.2,-D*1.2,D*2.4+640,D*2.4+640);x.translate(0,0);
  // 偶尔一道宽一点的“射线纹”
  for(let k=0;k<(opt.fleck===undefined?3:opt.fleck);k++){x.globalAlpha=.12;x.fillStyle=shade(col,-.2);const u=(R()-.5)*D*1.4,v=(R()-.5)*D*1.4;x.beginPath();x.ellipse(u,v,60+R()*120,3+R()*5,0,0,7);x.fill();}
  x.restore();
  // 拼缝
  x.save();x.beginPath();path(x);x.strokeStyle='rgba(40,28,20,.75)';x.lineWidth=opt.seam||2.2;x.lineJoin='round';x.stroke();x.restore();}
const poly=pts=>x=>{x.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)x.lineTo(pts[i][0],pts[i][1]);x.closePath();};
const rect=(a,b,w,h)=>x=>x.rect(a,b,w,h);
// 最后一层：整体一点清漆光泽 + 细噪点
function finish(x,R){const g=x.createLinearGradient(0,0,PW,PH);g.addColorStop(0,'rgba(255,245,220,.10)');g.addColorStop(.5,'rgba(255,245,220,0)');g.addColorStop(1,'rgba(60,30,10,.10)');x.fillStyle=g;x.fillRect(0,0,PW,PH);
  // 细噪点：一张 128×128 的噪点小图铺满（比逐像素改快很多）
  const nc=document.createElement('canvas');nc.width=nc.height=128;const ng=nc.getContext('2d'),nd=ng.createImageData(128,128);
  for(let i=0;i<nd.data.length;i+=4){const v=R()<.5?0:255;nd.data[i]=nd.data[i+1]=nd.data[i+2]=v;nd.data[i+3]=Math.round(R()*14);}ng.putImageData(nd,0,0);
  x.fillStyle=x.createPattern(nc,'repeat');x.fillRect(0,0,PW,PH);}
// 外框：胡桃木边 + 一圈乌木细线
function frame(x){const b=26;
  veneer(x,poly([[0,0],[PW,0],[PW-b,b],[b,b]]),'walnut',0,901,{fleck:1});veneer(x,poly([[0,PH],[PW,PH],[PW-b,PH-b],[b,PH-b]]),'walnut',0,902,{fleck:1});
  veneer(x,poly([[0,0],[b,b],[b,PH-b],[0,PH]]),'walnut',Math.PI/2,903,{fleck:1});veneer(x,poly([[PW,0],[PW-b,b],[PW-b,PH-b],[PW,PH]]),'walnut',Math.PI/2,904,{fleck:1});
  x.strokeStyle=WOOD.ebony;x.lineWidth=5;x.strokeRect(b+2.5,b+2.5,PW-2*b-5,PH-2*b-5);x.strokeStyle=WOOD.birch;x.lineWidth=2;x.strokeRect(b+7,b+7,PW-2*b-14,PH-2*b-14);}

    const line=v.every(q=>q===1),miss=v.includes(1)&&v.includes(0);out.push({x1,y1,x2,y2,line,miss,key:`${x1},${y1},${x2},${y2}`});};

function wrongTiles(){const sol=L.sol.map(parse);const wrong=[];

function undo(){if(!hist.length||won)return;const h=hist.pop();lastAct=Date.now();clearSel();
  if(h.b!==undefined)swapTiles(h.a,h.b);else spin(h.c,-h.d);}
// 提示：找一块放错的砖，亮一下。转向关按近的方向把它转对；换位关把该放这儿的砖换过来
function hint(){if(won)return;const w=wrongTiles();if(!w.length)return;const c=w[0];const e=epoch;
  stats.hint++;lastAct=Date.now();tick();
  if(L.swap){const want=L.sol[c],str=d=>base[d]&&base[d].join('');
    const cand=G.map((t,d)=>d).filter(d=>d!==c&&base[d]&&!locked(d)&&str(d)===want&&str(d)!==L.sol[d]);
    let d=cand.find(d=>L.sol[d]===str(c));if(d===undefined)d=cand[0];
    clearSel();G[c].g.classList.add('hint');G[d].g.classList.add('hint');
    setTimeout(()=>{if(won||e!==epoch)return;hist.push({a:c,b:d});stats.moves++;tick();swapTiles(c,d);},380);
    toast('这两块砖换一下');return;}
  G[c].g.classList.add('hint');
  let k=0;while(rotM(base[c],(rot[c]+k)%4).join('')!==L.sol[c]&&k<4)k++;
  const d=k===3?-1:1;let n=k===3?1:k;
  const step=()=>{if(won||e!==epoch||n<=0)return;n--;hist.push({c,d});stats.moves++;tick();spin(c,d);if(n>0)setTimeout(step,260);};
  setTimeout(step,350);toast('这块砖应该这样放');}

// ===================== 通关 =====================
function win(){won=true;clearInterval(timer);clearSel();render();buzz([20,40,20]);
  const sec=Math.round(((pausedAt||Date.now())-stats.t0)/1000);
  const done=store.get('tilev6.done')||[];const fresh=!done.includes(lv);if(fresh){done.push(lv);store.set('tilev6.done',done);}
  const unit=L.swap?'次':'下';
  $('winPaint').style.display=L.tut?'none':'';$('winPic').textContent='';
  if(L.tut){$('winTitle').textContent=`学会了 ✓`;$('winStars').innerHTML='';$('winText').innerHTML=L.learned;$('winSub').textContent='';
    $('nextBtn').textContent=lv<NT-1?'下一个教学':'开始第 1 关';}
  else{const st=starsOf(),best=store.get('tilev6.stars')||{};if(st>(best[lv]||0)){best[lv]=st;store.set('tilev6.stars',best);}
    const end=lv===chLast(L.ch);
    $('winTitle').textContent=end?`第${L.ch+1}章 完成！`:`${lvName(lv)} 通关！`;
    $('winStars').innerHTML=[0,1,2].map(k=>`<span class="${k<st?'on':''}" style="animation-delay:${.1+k*.2}s">★</span>`).join('');
    $('winText').innerHTML=(end?`${lvName(lv)} · `:'')+`用时 ${fmt(sec)} · ${L.swap?'换':'转'}了 ${stats.moves} ${unit}`+(stats.hint?` · 提示 ${stats.hint} 次`:'');
    $('winSub').textContent=st===3?'':'不用提示就是三星';
    $('nextBtn').textContent=lv===LEVELS.length-1?'回到第1关':end?`进入第${L.ch+2}章`:'下一关';
    // 画：这一块亮出来；刚好拼完一整幅，标题换成画名
    const pc=pieceOf(lv),got=piecesOf(pc.p).filter(i=>done.includes(i)).length;
    paintHTML($('winPaint'),pc.p,done,fresh?lv:-1);
    $('winPic').textContent=`《${PICS[pc.p].name}》 ${got}/25`;
    if(fresh&&got===25)$('winTitle').textContent=`《${PICS[pc.p].name}》拼完了！`;}
  renderPick();
  const e=epoch;runLight(()=>{svg.classList.add('won');
    const show=()=>setTimeout(()=>{if(won&&e===epoch)showM('win')},L.tut?450:700);
    if(L.tut)show();else setTimeout(()=>{if(won&&e===epoch)reveal(show);},250);});}
// 一幅画的缩略图：拿到的块露出来，没拿到的盖着深色（上面写关号）；hi = 刚拿到的那一关，盖子慢慢揭开
function paintHTML(el,p,done,hi){el.style.backgroundImage=`url(${PICS[p].src})`;
  el.innerHTML=piecesOf(p).map(i=>{const k=pieceOf(i).k,cls=i===hi?'new':done.includes(i)?'got':'';
    return `<i class="${cls}" style="left:${k%5*20}%;top:${Math.floor(k/5)*20}%;width:20%;height:20%">${cls?'':i-NT+1}</i>`;}).join('');}
// 盘面对应画上的哪一块：按盘面的长宽比从这一块里居中裁一块（盘面方一点就上下裁掉一点）
function cropOf(pc){const a=W/H,x0=pc.k%5*PX,y0=Math.floor(pc.k/5)*PY;
  if(a>PX/PY){const h=PX/a;return{x:x0,y:y0+(PY-h)/2,w:PX,h};}const w=PY*a;return{x:x0+(PX-w)/2,y:y0,w,h:PY};}
// 每格取这一小块画的平均色
function sample(im,cr){const k=8,cv=document.createElement('canvas');cv.width=W*k;cv.height=H*k;const x=cv.getContext('2d',{willReadFrequently:true});
  x.drawImage(im,cr.x,cr.y,cr.w,cr.h,0,0,W*k,H*k);const d=x.getImageData(0,0,W*k,H*k).data,out=[];
  for(let c=0;c<W*H;c++){const cx=c%W,cy=(c/W)|0;let r=0,g=0,b=0;
    for(let yy=0;yy<k;yy++)for(let xx=0;xx<k;xx++){const o=((cy*k+yy)*W*k+cx*k+xx)*4;r+=d[o];g+=d[o+1];b+=d[o+2];}
    out.push(`rgb(${Math.round(r/k/k)},${Math.round(g/k/k)},${Math.round(b/k/k)})`);}
  return out;}
// 揭晓：砖、线、点淡掉，每格换成一个色块（从左上角一波一波铺开），再淡入成真正的画
function reveal(done){const pc=pieceOf(lv),im=PIMG[pc.p],e=epoch;
  if(!im||!PICS[pc.p].src){done();return;}
  const cr=cropOf(pc),cols=sample(im,cr),mg=mk('g',{class:'mos'}),step=Math.min(45,700/(W+H));
  svg.classList.add('mosaic');
  cols.forEach((col,c)=>{const x=c%W,y=(c/W)|0;mk('rect',{x:x*S+1.5,y:y*S+1.5,width:S-3,height:S-3,rx:5,fill:col,style:`animation-delay:${(x+y)*step}ms`},mg);});
  const k=W*S/cr.w,id='pc'+e;
  const cp=mk('clipPath',{id});mk('rect',{x:0,y:0,width:W*S,height:H*S,rx:8},cp);
  const img=mk('image',{class:'pimg',href:PICS[pc.p].src,x:-cr.x*k,y:-cr.y*k,width:PW*k,height:PH*k,preserveAspectRatio:'none','clip-path':`url(#${id})`});
  setTimeout(()=>{if(e!==epoch)return;img.classList.add('show');setTimeout(()=>e===epoch&&done(),1150);},(W+H)*step+650);}
function renderGal(){const done=store.get('tilev6.done')||[];
  $('galList').innerHTML=PICS.map((p,j)=>{const ids=piecesOf(j),got=ids.filter(i=>done.includes(i)).length;
    return `<div><div class="gh">《${p.name}》<span>第${ids[0]-NT+1}–${ids[ids.length-1]-NT+1}关 · ${got}/25</span></div><div class="paint" data-p="${j}"></div></div>`;}).join('');
  $('galList').querySelectorAll('.paint').forEach(el=>paintHTML(el,+el.dataset.p,done,-1));}
// 光点：从左上角出发顺时针沿圈跑一圈，跑过的线变绿
const segKey=(p,q)=>p[0]<q[0]||p[1]<q[1]?`${p[0]},${p[1]},${q[0]},${q[1]}`:`${q[0]},${q[1]},${p[0]},${p[1]}`;
function loopPath(lines){const adj={};
  for(const e of lines){const a=e.x1+','+e.y1,b=e.x2+','+e.y2;(adj[a]=adj[a]||[]).push(b);(adj[b]=adj[b]||[]).push(a);}
  const pt=v=>v.split(',').map(Number);
  const s=Object.keys(adj).sort((p,q)=>{const a=pt(p),b=pt(q);return a[1]-b[1]||a[0]-b[0];})[0];
  let prev=s,at=adj[s].find(v=>pt(v)[1]===pt(s)[1])||adj[s][0];const P=[pt(s)];
  for(let i=0;i<lines.length&&at!==s;i++){P.push(pt(at));const nx=adj[at][0]===prev?adj[at][1]:adj[at][0];prev=at;at=nx;}
  P.push(pt(s));return P;}
function runLight(done){const P=loopPath(analyze().lines),n=P.length-1,e=epoch;
  const dur=Math.max(1000,Math.min(2600,n*55)),t0=performance.now();
  const halo=mk('circle',{class:'glow',r:15}),core=mk('circle',{class:'core',r:6.5});
  let lit=0;
  const frame=now=>{if(e!==epoch){halo.remove();core.remove();return;}
    const t=Math.max(0,Math.min(1,(now-t0)/dur)),pos=t*n,i=Math.min(n-1,Math.floor(pos)),f=pos-i;
    const x=(P[i][0]+(P[i+1][0]-P[i][0])*f)*S,y=(P[i][1]+(P[i+1][1]-P[i][1])*f)*S;
    for(const c of[halo,core]){c.setAttribute('cx',x);c.setAttribute('cy',y);}
    for(;lit<Math.floor(pos)&&lit<n;lit++){const l=lineEls[segKey(P[lit],P[lit+1])];if(l)l.classList.add('lit');}
    if(t<1){requestAnimationFrame(frame);return;}
    for(;lit<n;lit++){const l=lineEls[segKey(P[lit],P[lit+1])];if(l)l.classList.add('lit');}
    halo.remove();core.remove();done();};
  requestAnimationFrame(frame);}
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function tick(){$('stTime').textContent='用时 '+fmt(Math.max(0,Math.round(((pausedAt||Date.now())-stats.t0)/1000)));
  $('stMove').textContent=L.swap?`换了 ${stats.moves} 次`:`转了 ${stats.moves} 下`;
  $('stHint').textContent=`提示 ${stats.hint} 次`;
  if(L.tut&&!finger&&L.finger==='idle')placeFinger();}
// 选关：每关显示拿到的最好星数，章节标题上是这一章的星星总数
function renderPick(){const done=store.get('tilev6.done')||[],best=store.get('tilev6.stars')||{};$('lvBtn').textContent=`${lvName(lv)} ▾`;
  $('prevBtn').disabled=lv===0;$('nextBtn2').disabled=lv===LEVELS.length-1;
  const btn=i=>{const l=LEVELS[i];return `<button class="${i===lv?'cur':''}${l.tut&&done.includes(i)?' done':''}${l.swap?' sw':''}" data-i="${i}">`+
    (l.tut?'教'+(i+1):`${i-NT+1}<i>${'★'.repeat(best[i]||0)}</i>`)+'</button>';};
  const ids=k=>LEVELS.map((l,i)=>i).filter(i=>!LEVELS[i].tut&&LEVELS[i].ch===k);
  const sum=a=>a.reduce((p,i)=>p+(best[i]||0),0);
  let h=`<div class="chh">教学</div><div class="picks">${LEVELS.map((l,i)=>l.tut?btn(i):'').join('')}</div>`;
  CHAPTERS.forEach((c,k)=>{const a=ids(k);h+=`<div class="chh">第${k+1}章 · ${c.name}<span>★ ${sum(a)}/${a.length*3}</span></div><div class="picks">${a.map(btn).join('')}</div>`;});
  $('pickList').innerHTML=h;const all=LEVELS.map((l,i)=>i).filter(i=>!LEVELS[i].tut);
  $('pickTitle').innerHTML=`选关<small>★ ${sum(all)} / ${all.length*3}</small>`;}
let toastT;function toast(m,ms){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),ms||1800);}

// ===================== 规则图解 =====================
// 小图：一排格子。cells：'t' 能转的砖 / 'l' 固定砖 / 'e' 空格；line：格线上的黑线；bars：[格子, 方向] 橙色短杠；shapes：[格子, 方向] 浅色短杠（砖的形状）；
// arrows：每块砖上画的箭头；swap：两块砖中间画一对来回的箭头
function mini(cells,opt){opt=opt||{};const n=cells.length,p=8;
  let s=`<svg viewBox="${-p} ${-p} ${n*S+p*2} ${S+p*2}" style="width:${n*48}px">`;
  cells.forEach((k,x)=>{
    if(k==='e')s+=`<rect class="blank" x="${x*S+6}" y="6" width="${S-12}" height="${S-12}" rx="8"/>`;
    else{s+=`<g class="tile${k==='l'?' locked':''}">`+(k==='l'?'':`<rect class="edge" x="${x*S+3}" y="5" width="${S-6}" height="${S-7}" rx="9"/>`)+
      `<rect class="face" x="${x*S+3}" y="${k==='l'?3:2}" width="${S-6}" height="${k==='l'?S-6:S-7}" rx="9"/>`;
      (opt.bars||[]).filter(b=>b[0]===x).forEach(b=>{const q=BAR(x,0,b[1]);s+=`<line class="bar miss" x1="${q.x1}" y1="${q.y1}" x2="${q.x2}" y2="${q.y2}"/>`;});
      (opt.shapes||[]).filter(b=>b[0]===x).forEach(b=>{const q=BAR(x,0,b[1]);s+=`<line class="bar" style="opacity:1;stroke:#d3c4a2" x1="${q.x1}" y1="${q.y1}" x2="${q.x2}" y2="${q.y2}"/>`;});
      if(opt.arrows&&opt.arrows[x])s+=`<text class="num" x="${x*S+S/2}" y="${S/2}" style="font-size:28px">${opt.arrows[x]}</text>`;
      s+='</g>';}});
  (opt.line||[]).forEach(l=>s+=`<line class="line" x1="${l[0]*S}" y1="${l[1]*S}" x2="${l[2]*S}" y2="${l[3]*S}"/>`);
  if(!opt.swap)for(let x=0;x<=n;x++)for(let y=0;y<=1;y++)s+=`<circle cx="${x*S}" cy="${y*S}" r="4.2" fill="var(--dot)"/>`;
  if(opt.swap)s+=`<circle cx="${S}" cy="${S/2}" r="15" fill="var(--ink)"/><path d="M${S-8} ${S/2-4}h16m-5-4l5 4l-5 4M${S+8} ${S/2+5}h-16m5-4l-5 4l5 4" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`;
  return s+'</svg>';}
const ill=(svgs,txt)=>`<div class="ill"><span class="slot">${svgs}</span><div>${txt}</div></div>`;
$('rulesBody').innerHTML=
  ill(mini(['t','t'],{arrows:['↻','↺']}),'<b>点一下</b>砖顺时针转 90°，<b>按住</b>逆时针转（电脑上点右键）。砖上的数字 = 它有几条边。')+
  ill(mini(['t','t'],{line:[[1,0,1,1]]}),'两块砖中间的边，<b>两块都有</b>：变成<b>黑线</b>，对上了。')+
  ill(mini(['t','t'],{bars:[[0,1]]}),'<b>只有一块有</b>：露出<b class="o">橙色</b>，没对上。')+
  ill(mini(['l','t']),'<b class="b">深色</b>的砖是固定的，不能动。')+
  ill(mini(['t','e'],{line:[[1,0,1,1]]}),'空格和盘边没有砖，边朝着它们<b>直接算对上</b>。')+
  ill(mini(['t','t'],{swap:1,shapes:[[0,0],[0,3],[1,1],[1,2]]}),'<b>换位关</b>：砖的方向都对，有几块放错了位置。点两块砖（或者拖过去）交换位置。')+
  '<p style="margin:4px 0 6px">所有边都对上，并且连成<b>一个</b>圈，就过关。</p>'+
  '<p style="margin:0 0 6px">每过一关，盘面会变成一幅画上的一块，25 关拼成一幅（右上角 🖼 画册）。</p>'+
  '<p style="margin:0 0 8px;font-size:13px;color:var(--sub)">★ 星星看提示：没用提示是三星，用了 1–2 次是两星，再多是一星。</p>';
// 章节卡上的小图
const CH_ILL=[
  `<div class="center">${mini(['l','t','l'])}</div>`,
  `<div class="center">${mini(['t','e','t'],{line:[[1,0,1,1],[2,0,2,1]]})}</div>`,
];
$('blankBody').innerHTML=
  ill(mini(['t','e'],{line:[[1,0,1,1]]}),'虚线框是<b>空格</b>，里面没有砖。')+
  '<p style="margin:0 0 8px">空格那一侧没人反对，所以旁边的砖把边朝向空格（或者朝向盘边）时，<b>直接算对上</b>，变成黑线。</p>';
$('swapBody').innerHTML=`<div class="center">${mini(['t','t'],{swap:1,shapes:[[0,0],[0,3],[1,1],[1,2]]})}</div>`+
  '<p style="margin:0 0 6px">这种关里砖的<b>方向都是对的</b>，但有<b>几块砖放错了位置</b>，砖不能转。看橙色缺口，找出放错的砖。</p>'+
  '<p style="margin:0 0 8px">点一块砖，再点另一块，两块就<b>交换位置</b>；也可以直接把砖拖到另一块上。深色的砖不动。</p>';

// ===================== 输入 =====================
// 转向关：点一下顺时针转，按住 0.38 秒逆时针转（右键也是）。换位关：点两块砖交换，或者从一块拖到另一块
const tileAt=ev=>{const el=document.elementFromPoint(ev.clientX,ev.clientY);const g=el&&el.closest&&el.closest('.tile');return g?+g.dataset.c:-1;};
svg.addEventListener('pointerdown',ev=>{ev.preventDefault();const g=ev.target.closest('.tile');
  if(!g){if(L.swap)clearSel();return;}if(won)return;const c=+g.dataset.c;
  if(!L.swap&&ev.button===2){turn(c,-1);return;}
  press={c,x:ev.clientX,y:ev.clientY,moved:false,lp:false};G[c].g.classList.add('press');
  if(!L.swap&&!locked(c))press.timer=setTimeout(()=>{if(press&&press.c===c&&!press.moved){press.lp=true;G[c].g.classList.remove('press');turn(c,-1);}},380);});
window.addEventListener('pointermove',ev=>{if(!press)return;
  if(Math.hypot(ev.clientX-press.x,ev.clientY-press.y)>12)press.moved=true;
  if(L.swap&&press.moved&&!locked(press.c)){const t=tileAt(ev);
    if(sel!==press.c){clearSel();sel=press.c;G[sel].g.classList.add('sel');}
    G.forEach((q,d)=>q&&q.g.classList.toggle('tgt',d===t&&d!==press.c&&!locked(d)));}});
const endPress=ev=>{if(!press)return;const p=press;press=null;clearTimeout(p.timer);
  if(G[p.c])G[p.c].g.classList.remove('press');G.forEach(q=>q&&q.g.classList.remove('tgt'));
  if(!ev||won||p.lp)return;const t=tileAt(ev);
  if(L.swap){if(!p.moved)tapSwap(p.c);else if(t>=0&&t!==p.c)doSwap(p.c,t);return;}
  if(!p.moved||t===p.c)turn(p.c,1);};
window.addEventListener('pointerup',endPress);
window.addEventListener('pointercancel',()=>endPress(null));
svg.addEventListener('contextmenu',ev=>ev.preventDefault());
$('undoBtn').onclick=undo;$('hintBtn').onclick=hint;
$('resetBtn').onclick=()=>showM('resetM');
$('resetYes').onclick=()=>{hideM('resetM');loadLevel(lv);};$('resetNo').onclick=()=>hideM('resetM');
$('lvBtn').onclick=()=>showM('pick');$('pickClose').onclick=()=>hideM('pick');
$('pickList').onclick=ev=>{const b=ev.target.closest('button');if(b){hideM('pick');loadLevel(+b.dataset.i);}};
$('prevBtn').onclick=()=>lv>0&&loadLevel(lv-1);$('nextBtn2').onclick=()=>lv<LEVELS.length-1&&loadLevel(lv+1);
$('helpBtn').onclick=()=>showM('rules');
$('galBtn').onclick=()=>{renderGal();showM('galM');};$('galClose').onclick=()=>hideM('galM');
$('rulesClose').onclick=()=>hideM('rules');
$('rulesTut').onclick=()=>{hideM('rules');loadLevel(0);};
$('blankClose').onclick=()=>{hideM('blankCard');store.set('tilev6.blank',1);nextCard();};
$('swapClose').onclick=()=>{hideM('swapCard');store.set('tilev6.swap',1);nextCard();};
$('chClose').onclick=()=>{hideM('chCard');const s=store.get('tilev6.ch')||[];if(!s.includes(L.ch)){s.push(L.ch);store.set('tilev6.ch',s);}nextCard();};
$('nextBtn').onclick=()=>{hideM('win');loadLevel((lv+1)%LEVELS.length);};
$('stayBtn').onclick=()=>hideM('win');
document.addEventListener('keydown',ev=>{if((ev.ctrlKey||ev.metaKey)&&ev.key==='z'){ev.preventDefault();undo();}});

loadLevel(Math.min(store.get('tilev6.cur')||0,LEVELS.length-1));
</script>
